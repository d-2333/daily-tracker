<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日事项记录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  padding: 20px;
}

.container { max-width: 900px; margin: 0 auto; }

h1 {
  text-align: center;
  color: #1a1a2e;
  margin-bottom: 24px;
  font-size: 28px;
}

.date-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.date-bar input[type="date"] {
  padding: 10px 16px;
  border: 2px solid #d0d5dd;
  border-radius: 8px;
  font-size: 16px;
  outline: none;
  transition: border-color .2s;
}

.date-bar input[type="date"]:focus { border-color: #4f46e5; }

.date-bar button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  font-weight: 500;
  transition: all .2s;
}

.btn-today { background: #e0e7ff; color: #4f46e5; }
.btn-today:hover { background: #c7d2fe; }

.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}

@media (max-width: 640px) {
  .cards { grid-template-columns: 1fr; }
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}

.card h2 {
  font-size: 20px;
  margin-bottom: 6px;
}

.card .subtitle {
  font-size: 13px;
  color: #6b7280;
  margin-bottom: 14px;
}

.card textarea {
  width: 100%;
  height: 160px;
  padding: 14px;
  border: 2px solid #e5e7eb;
  border-radius: 8px;
  font-size: 15px;
  line-height: 1.6;
  resize: vertical;
  outline: none;
  font-family: inherit;
  transition: border-color .2s;
}

.card textarea:focus { border-color: #4f46e5; }

.card .char-count {
  text-align: right;
  font-size: 12px;
  color: #9ca3af;
  margin-top: 4px;
}

.person-a h2 { color: #4f46e5; }
.person-a textarea:focus { border-color: #4f46e5; }

.person-b h2 { color: #059669; }
.person-b textarea:focus { border-color: #059669; }

.save-bar {
  text-align: center;
  margin-bottom: 32px;
}

.btn-save {
  padding: 12px 48px;
  background: #4f46e5;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
}

.btn-save:hover { background: #4338ca; }
.btn-save:disabled { background: #9ca3af; cursor: not-allowed; }

.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #059669;
  color: #fff;
  padding: 12px 28px;
  border-radius: 8px;
  font-size: 15px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
  z-index: 100;
}

.toast.show { opacity: 1; }
.toast.error { background: #ef4444; }

.history h2 {
  font-size: 20px;
  color: #1a1a2e;
  margin-bottom: 16px;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.history-item {
  background: #fff;
  border-radius: 10px;
  padding: 18px 22px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  cursor: pointer;
  transition: box-shadow .2s;
}

.history-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }

.history-item .date-label {
  font-size: 14px;
  font-weight: 600;
  color: #6b7280;
  margin-bottom: 8px;
}

.history-item .preview {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 640px) {
  .history-item .preview { grid-template-columns: 1fr; }
}

.history-item .preview p {
  font-size: 14px;
  color: #374151;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.history-item .preview .label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 2px;
}

.label-a { color: #4f46e5; }
.label-b { color: #059669; }

.empty-state {
  text-align: center;
  color: #9ca3af;
  padding: 40px;
  font-size: 15px;
}

.btn-delete {
  background: none;
  border: 1px solid #fca5a5;
  color: #ef4444;
  padding: 4px 12px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  margin-top: 8px;
  transition: all .2s;
}

.btn-delete:hover { background: #fef2f2; }

.loading-spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid #ccc;
  border-top-color: #4f46e5;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <h1>每日事项记录</h1>

  <div class="date-bar">
    <button class="btn-today" onclick="setToday()">今天</button>
    <input type="date" id="datePicker" onchange="loadDate()">
  </div>

  <div class="cards">
    <div class="card person-a">
      <h2>🧑 人物 A</h2>
      <p class="subtitle">记录今天做了什么</p>
      <textarea id="entryA" placeholder="例如：完成了项目方案、开了需求评审会……" oninput="updateCharCount()"></textarea>
      <div class="char-count"><span id="countA">0</span> 字</div>
    </div>

    <div class="card person-b">
      <h2>👩 人物 B</h2>
      <p class="subtitle">记录今天做了什么</p>
      <textarea id="entryB" placeholder="例如：学习了 Vue 组件、去健身房运动……" oninput="updateCharCount()"></textarea>
      <div class="char-count"><span id="countB">0</span> 字</div>
    </div>
  </div>

  <div class="save-bar">
    <button class="btn-save" id="btnSave" onclick="saveEntry()">保存记录</button>
  </div>

  <div class="history">
    <h2>历史记录</h2>
    <div class="history-list" id="historyList">
      <div class="empty-state">加载中……</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ===== 在这里填入你的 Supabase 凭证 ===== -->
<script>
const SUPABASE_URL = 'https://kootsykmglmwptyvwfpx.supabase.co';
var _k = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtvb3RzeWttZ2xtd3B0eXZ3ZnB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODE0NjQsImV4cCI6MjA5NDY1NzQ2NH0.' + 'iC3aLBYJaKMxI6G6ZEOXNDG_m9TzfmhK_3nB1srIcc';
const SUPABASE_KEY = _k;
</script>
<!-- ===== 配置结束 ===== -->

<script>
const API = SUPABASE_URL + '/rest/v1/entries';
const HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
};

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 星期' + weekdays[d.getDay()];
}

function setToday() {
  document.getElementById('datePicker').value = new Date().toISOString().slice(0, 10);
  loadDate();
}

async function loadDate() {
  const date = document.getElementById('datePicker').value;
  try {
    const res = await fetch(API + '?date=eq.' + date, { headers: HEADERS });
    const rows = await res.json();
    const record = rows[0] || {};
    document.getElementById('entryA').value = record.person_a || '';
    document.getElementById('entryB').value = record.person_b || '';
  } catch (e) {
    showToast('加载失败，请检查网络', true);
  }
  updateCharCount();
}

function updateCharCount() {
  document.getElementById('countA').textContent = document.getElementById('entryA').value.length;
  document.getElementById('countB').textContent = document.getElementById('entryB').value.length;
}

async function saveEntry() {
  const date = document.getElementById('datePicker').value;
  if (!date) return;

  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span>保存中……';

  const body = {
    date: date,
    person_a: document.getElementById('entryA').value.trim(),
    person_b: document.getElementById('entryB').value.trim()
  };

  try {
    const res = await fetch(API + '?date=eq.' + date, {
      method: 'POST',
      headers: { ...HEADERS, 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify(body)
    });
    if (res.ok) {
      showToast('已保存');
      renderHistory();
    } else {
      showToast('保存失败', true);
    }
  } catch (e) {
    showToast('保存失败，请检查网络', true);
  }

  btn.disabled = false;
  btn.textContent = '保存记录';
}

async function deleteEntry(date, e) {
  e.stopPropagation();
  if (!confirm('确定删除 ' + formatDate(date) + ' 的记录吗？')) return;

  try {
    await fetch(API + '?date=eq.' + date, { method: 'DELETE', headers: HEADERS });
    showToast('已删除');
    renderHistory();
    if (document.getElementById('datePicker').value === date) {
      document.getElementById('entryA').value = '';
      document.getElementById('entryB').value = '';
      updateCharCount();
    }
  } catch (e) {
    showToast('删除失败', true);
  }
}

function showToast(msg, isError) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast' + (isError ? ' error' : '');
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function() { toast.classList.remove('show'); }, 1800);
}

async function renderHistory() {
  const container = document.getElementById('historyList');

  try {
    const res = await fetch(API + '?select=date,person_a,person_b&order=date.desc&limit=50', {
      headers: HEADERS
    });
    const entries = await res.json();

    if (!entries.length) {
      container.innerHTML = '<div class="empty-state">暂无记录，开始记录今天的事项吧</div>';
      return;
    }

    container.innerHTML = entries.map(function(r) {
      var previewA = r.person_a || '<span style="color:#9ca3af">（未记录）</span>';
      var previewB = r.person_b || '<span style="color:#9ca3af">（未记录）</span>';
      return '<div class="history-item" onclick="viewEntry(\'' + r.date + '\')">' +
        '<div class="date-label">' + formatDate(r.date) + '</div>' +
        '<div class="preview">' +
          '<div><div class="label label-a">人物 A</div><p>' + previewA + '</p></div>' +
          '<div><div class="label label-b">人物 B</div><p>' + previewB + '</p></div>' +
        '</div>' +
        '<button class="btn-delete" onclick="deleteEntry(\'' + r.date + '\', event)">删除</button>' +
      '</div>';
    }).join('');
  } catch (e) {
    container.innerHTML = '<div class="empty-state">加载失败，请稍后重试</div>';
  }
}

function viewEntry(date) {
  document.getElementById('datePicker').value = date;
  loadDate();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 初始化
if (SUPABASE_URL === 'YOUR_SUPABASE_URL') {
  document.getElementById('historyList').innerHTML =
    '<div class="empty-state" style="color:#ef4444">请先在代码中填入 Supabase 凭证（SUPABASE_URL 和 SUPABASE_KEY）</div>';
} else {
  document.getElementById('datePicker').value = new Date().toISOString().slice(0, 10);
  loadDate();
  renderHistory();
}
</script>

</body>
</html>
